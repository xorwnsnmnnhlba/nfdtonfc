plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.AZUL
    }
}

application {
    mainClass = 'com.example.nfdtonfc.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.example.nfdtonfc.Main',
                   'Implementation-Version': version
    }
}

tasks.register('jpackageInstaller', Exec) {
    dependsOn jar
    def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
    def jpackage = "${javaHome}/bin/jpackage"
    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
    def os = System.getProperty('os.name').toLowerCase()
    def type = os.contains('mac') ? 'pkg' : os.contains('win') ? 'msi' : 'deb'
    def resourceDir = file('src/jpackage').absolutePath
    doFirst { outputDir.deleteDir() }
    def inputDir = jar.destinationDirectory.get().asFile
    def args = [jpackage,
        '--type', type,
        '--name', 'nfdtonfc',
        '--app-version', version,
        '--main-jar', jar.archiveFileName.get(),
        '--main-class', 'com.example.nfdtonfc.Main',
        '--input', inputDir.absolutePath,
        '--dest', outputDir.absolutePath,
        '--java-options', '-Dfile.encoding=UTF-8',
        '--java-options', '-Dstdout.encoding=UTF-8',
        '--java-options', '-Dstderr.encoding=UTF-8',
        '--java-options', '--enable-native-access=ALL-UNNAMED']
    if (os.contains('linux') || os.contains('mac')) {
        args += ['--resource-dir', resourceDir]
    }
    if (os.contains('linux')) {
        args += ['--app-content', file('src/jpackage/nautilus-script').absolutePath]
    }
    if (os.contains('win')) {
        args += ['--win-console']
    }
    commandLine args
}
