plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.AZUL
    }
}

application {
    mainClass = 'com.example.nfdtonfc.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.example.nfdtonfc.Main'
    }
}

tasks.register('jpackageImage', Exec) {
    dependsOn jar
    def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
    def jpackage = "${javaHome}/bin/jpackage"
    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
    doFirst { outputDir.deleteDir() }
    commandLine jpackage,
        '--type', 'app-image',
        '--name', 'nfdtonfc',
        '--main-jar', jar.archiveFileName.get(),
        '--main-class', 'com.example.nfdtonfc.Main',
        '--input', jar.destinationDirectory.get().asFile.absolutePath,
        '--dest', outputDir.absolutePath
}
