name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact: nfdtonfc-1.0.0.dmg
            ext: dmg
            os-name: macos
          - os: windows-2025
            artifact: nfdtonfc-1.0.0.msi
            ext: msi
            os-name: windows
          - os: ubuntu-24.04
            artifact: nfdtonfc_1.0.0_amd64.deb
            ext: deb
            os-name: ubuntu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Grant execute permission (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build installer
        run: ./gradlew jpackageInstaller

      - name: Rename artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: cp build/jpackage/${{ matrix.artifact }} nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: copy build\jpackage\${{ matrix.artifact }} nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}
          path: nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
