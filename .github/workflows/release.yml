name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            release-name: nfdtonfc-macos.tar.gz
          - os: windows-2025
            release-name: nfdtonfc-windows.zip
          - os: ubuntu-24.04
            release-name: nfdtonfc-ubuntu.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Grant execute permission (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build with jpackage
        run: ./gradlew jpackageImage

      - name: Package artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.release-name }} -C build/jpackage .

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/jpackage/* -DestinationPath ${{ matrix.release-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.release-name }}
          path: ${{ matrix.release-name }}

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: |
            artifacts/nfdtonfc-macos.tar.gz/nfdtonfc-macos.tar.gz
            artifacts/nfdtonfc-windows.zip/nfdtonfc-windows.zip
            artifacts/nfdtonfc-ubuntu.tar.gz/nfdtonfc-ubuntu.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
