name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            release-name: nfdtonfc-macos.dmg
            artifact: nfdtonfc-1.0.0.dmg
          - os: windows-2025
            release-name: nfdtonfc-windows.msi
            artifact: nfdtonfc-1.0.0.msi
          - os: ubuntu-24.04
            release-name: nfdtonfc-ubuntu.deb
            artifact: nfdtonfc_1.0.0_amd64.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Grant execute permission (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build installer
        run: ./gradlew jpackageInstaller

      - name: Rename artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: cp build/jpackage/${{ matrix.artifact }} ${{ matrix.release-name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: copy build\jpackage\${{ matrix.artifact }} ${{ matrix.release-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.release-name }}
          path: ${{ matrix.release-name }}

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: |
            artifacts/nfdtonfc-macos.dmg/nfdtonfc-macos.dmg
            artifacts/nfdtonfc-windows.msi/nfdtonfc-windows.msi
            artifacts/nfdtonfc-ubuntu.deb/nfdtonfc-ubuntu.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
