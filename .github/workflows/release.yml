name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            ext: pkg
            os-name: macos
          - os: windows-2025
            ext: msi
            os-name: windows
          - os: ubuntu-24.04
            ext: deb
            os-name: ubuntu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Grant execute permission (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Set version in postinst man page (Ubuntu)
        if: matrix.os-name == 'ubuntu'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/\.TH NFDTONFC 1 \"2026\" \"1\.0\.0\"/.TH NFDTONFC 1 \"2026\" \"${VERSION}\"/" src/jpackage/postinst

      - name: Set version in build.gradle
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/version = '1\.0\.0'/version = '${VERSION}'/" build.gradle

      - name: Build installer
        run: ./gradlew jpackageInstaller

      - name: Rename artifact (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          if [ "${{ matrix.ext }}" = "deb" ]; then
            cp build/jpackage/nfdtonfc_${VERSION}_amd64.deb nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}
          else
            cp build/jpackage/nfdtonfc-${VERSION}.${{ matrix.ext }} nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}
          fi

      - name: Patch MSI to register PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $msiPath = (Resolve-Path "build\jpackage\nfdtonfc-${VERSION}.msi").Path
          & "src\windows\patch-msi-path.ps1" -MsiPath $msiPath

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          copy "build\jpackage\nfdtonfc-${VERSION}.${{ matrix.ext }}" "nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}
          path: nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
