name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            ext: dmg
            os-name: macos
          - os: windows-2025
            ext: msi
            os-name: windows
          - os: ubuntu-24.04
            ext: deb
            os-name: ubuntu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v5.2.0
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Grant execute permission (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build installer
        run: ./gradlew jpackageInstaller

      - name: Rename artifact (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          if [ "${{ matrix.ext }}" = "deb" ]; then
            cp build/jpackage/nfdtonfc_${VERSION}_amd64.deb nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}
          else
            cp build/jpackage/nfdtonfc-${VERSION}.${{ matrix.ext }} nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}
          fi

      - name: Patch MSI to register PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          $msiPath = (Resolve-Path "build\jpackage\nfdtonfc-${VERSION}.msi").Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $installer, @($msiPath, 1))

          # 첫 번째 컴포넌트 조회
          $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @("SELECT `Component` FROM `Component`"))
          $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
          $record = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
          $component = $record.GetType().InvokeMember("StringData", "GetProperty", $null, $record, @(1))
          $view.GetType().InvokeMember("Close", "InvokeMethod", $null, $view, $null)

          # Environment 테이블 생성
          try {
            $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @("CREATE TABLE ``Environment`` (``Environment`` CHAR(72) NOT NULL, ``Name`` CHAR(255) NOT NULL LOCALIZABLE, ``Value`` CHAR(255) LOCALIZABLE, ``Component_`` CHAR(72) NOT NULL PRIMARY KEY ``Environment``)"))
            $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
            $view.GetType().InvokeMember("Close", "InvokeMethod", $null, $view, $null)
          } catch {}

          # PATH 등록
          $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @("INSERT INTO ``Environment`` (``Environment``, ``Name``, ``Value``, ``Component_``) VALUES ('PATH_NFDTONFC', 'PATH', '[INSTALLDIR]', '$component')"))
          $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
          $view.GetType().InvokeMember("Close", "InvokeMethod", $null, $view, $null)

          $db.GetType().InvokeMember("Commit", "InvokeMethod", $null, $db, $null)

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.VERSION }}"
          copy "build\jpackage\nfdtonfc-${VERSION}.${{ matrix.ext }}" "nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}
          path: nfdtonfc-${{ github.ref_name }}-${{ matrix.os-name }}.${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
